name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version
        # Tag v1.2.3 -> 1.2.3. Manual runs get 0.0.0, which the in-app updater treats as a local build.
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --build-name=$env:APP_VERSION --dart-define=APP_VERSION=$env:APP_VERSION
      - name: Add Visual C++ runtime
        # App-local copies, so the app starts on PCs without the VC++ redistributable.
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" app/build/windows/x64/runner/Release/
          }
      - name: Package zip
        shell: pwsh
        run: tar -a -c -f degree-atlas-windows.zip -C app/build/windows/x64/runner/Release .
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer/degree-atlas.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item installer/output/DegreeAtlas-Setup-*.exe .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: degree-atlas-windows
          path: |
            degree-atlas-windows.zip
            DegreeAtlas-Setup-*.exe
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" degree-atlas-windows.zip (Get-Item DegreeAtlas-Setup-*.exe).Name --generate-notes --title "${{ github.ref_name }}"
