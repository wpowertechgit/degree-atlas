name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package
        shell: pwsh
        run: tar -a -c -f degree-atlas-windows.zip -C app/build/windows/x64/runner/Release .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: degree-atlas-windows
          path: degree-atlas-windows.zip
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" degree-atlas-windows.zip --generate-notes --title "${{ github.ref_name }}"
