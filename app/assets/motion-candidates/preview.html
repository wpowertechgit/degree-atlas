<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Degree Atlas motion samples</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #211d1b;
      background: #efe7dd;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    main {
      width: min(58rem, calc(100% - 2rem));
      margin: 2rem auto;
      padding: clamp(1rem, 5vw, 3rem);
      background: repeating-linear-gradient(
        #fffbf0 0 27px, #ebeef0 27px 28px
      );
      border-left: 2px solid #e6c7c7;
    }
    header { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.25rem); }
    button {
      background: #732f36;
      color: #fffbf0;
      border: 0;
      border-radius: .3rem;
      padding: .6rem .9rem;
      font: inherit;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #2b5078; outline-offset: 3px; }
    .samples {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
      gap: .8rem;
      margin: 1.6rem 0;
    }
    figure {
      margin: 0;
      padding: 1.2rem .5rem;
      text-align: center;
      background: #fffbf0;
      box-shadow: 2px 2px #e8dcd0;
      border: 1px solid #e8dcd0;
    }
    img { display: block; width: 64px; height: 64px; margin: 0 auto .7rem; }
    a { color: #2b5078; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Degree Atlas motion samples</h1>
      <button type="button" id="replay">Replay all</button>
    </header>
    <div class="samples">
      <figure><img src="line-md/beer-alt-loop.svg" alt=""><figcaption>Beer</figcaption></figure>
      <figure><img src="line-md/computer.svg" alt=""><figcaption>Computer</figcaption></figure>
      <figure><img src="line-md/cog-loop.svg" alt=""><figcaption>Cog</figcaption></figure>
      <figure><img src="line-md/chat-round-dots.svg" alt=""><figcaption>Chat</figcaption></figure>
      <figure><img src="line-md/pencil.svg" alt=""><figcaption>Pencil</figcaption></figure>
    </div>
    <p>SVGs by <a href="https://github.com/cyberalien/line-md">Line MD</a> · <a href="line-md/license.txt">MIT license</a></p>
  </main>
  <script>
    document.querySelector('#replay').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
